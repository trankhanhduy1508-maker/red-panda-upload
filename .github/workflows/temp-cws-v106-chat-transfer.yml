name: temp-cws-v106-chat-transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-cws-v106-chat-transfer.yml

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 'https://cws-market-replay-v106-download.vercel.app/CWS-Market-Replay-v1.0.6-FINAL.apk' -o CWS-Market-Replay-v1.0.6-FINAL.apk
          test "$(stat -c %s CWS-Market-Replay-v1.0.6-FINAL.apk)" = '94831154'
          echo 'd3f2362aa3ac6b29329cbb505cae6d6fc8b87a902830d95f435d9178d5e0ea75  CWS-Market-Replay-v1.0.6-FINAL.apk' | sha256sum -c -
      - name: Upload exact APK
        uses: actions/upload-artifact@v4
        with:
          name: CWS-Market-Replay-v1.0.6-FINAL
          path: CWS-Market-Replay-v1.0.6-FINAL.apk
          compression-level: 0
          retention-days: 1
